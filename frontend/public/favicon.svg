<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE08A"></stop>
      <stop offset="50%" stop-color="#D4AF37"></stop>
      <stop offset="100%" stop-color="#9C6B00"></stop>
    </linearGradient>

    <linearGradient id="green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14532D"></stop>
      <stop offset="100%" stop-color="#0B2E13"></stop>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity=".35"></feDropShadow>
    </filter>
  </defs>

  <!-- Outer Circle -->
  <circle cx="256" cy="256" r="220" fill="url(#green)" stroke="url(#gold)" stroke-width="16" filter="url(#shadow)"></circle>

  <!-- Cards -->
  <g transform="translate(256 170)">
      <g transform="translate(-80 0) rotate(-18)">
          <rect x="-40" y="-70" width="80" height="120" rx="8" fill="#FFF8EE"></rect>
          <text x="0" y="-30" text-anchor="middle" font-size="28" fill="#111">♠</text>
          <text x="0" y="20" text-anchor="middle" font-size="22" fill="#111">K</text>
      </g>

      <g transform="translate(0 -10)">
          <rect x="-40" y="-70" width="80" height="120" rx="8" fill="#FFF8EE"></rect>
          <text x="0" y="-30" text-anchor="middle" font-size="28" fill="#D11A2A">♥</text>
          <text x="0" y="20" text-anchor="middle" font-size="22" fill="#D11A2A">Q</text>
      </g>

      <g transform="translate(80 0) rotate(18)">
          <rect x="-40" y="-70" width="80" height="120" rx="8" fill="#FFF8EE"></rect>
          <text x="0" y="-30" text-anchor="middle" font-size="28" fill="#111">♣</text>
          <text x="0" y="20" text-anchor="middle" font-size="22" fill="#111">J</text>
      </g>
  </g>

  <!-- Spade -->
  <text x="256" y="255" text-anchor="middle" font-size="44" fill="url(#gold)">♠</text>

  <!-- Title -->
  <text x="256" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="74" font-weight="700" fill="url(#gold)" letter-spacing="4">
      TAASH
  </text>

  <!-- Subtitle -->
  <text x="256" y="382" text-anchor="middle" font-family="Arial" font-size="18" fill="#F5F5F5" letter-spacing="3">
      MINDI COAT
  </text>
</svg>